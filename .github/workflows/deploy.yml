name: Deploy STAFF (site + bot)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sshpass and rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass rsync

      - name: Upload repo to server (rsync)
        run: |
          set -euo pipefail

          REMOTE="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          REMOTE_DIR="${{ secrets.APP_DIR }}"
          SSH_CMD="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p ${{ secrets.SSH_PORT }}"

          sshpass -p "${{ secrets.SSH_PASSWORD }}" \
            rsync -az --delete \
            -e "$SSH_CMD" \
            --exclude ".git" \
            --exclude "node_modules" \
            "$GITHUB_WORKSPACE/" \
            "$REMOTE:$(printf '%q' "$REMOTE_DIR")/"

      - name: Install + Reload PM2 (staff-site + staff-bot)
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            cd "${{ secrets.APP_DIR }}"

            # Маркер версии — чтобы ты всегда видел, что обновилось
            echo "${{ github.sha }} $(date -u +%Y-%m-%dT%H:%M:%SZ)" > version.txt

            # зависимости
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi

            # build если есть
            npm run build --if-present

            # ВАЖНО: перезапускаем только два процесса этого проекта
            TG_BOT_TOKEN="${{ secrets.TG_BOT_TOKEN }}" \
              pm2 startOrReload ecosystem.config.js --env production

            pm2 save
            pm2 status staff-site
            pm2 status staff-bot
